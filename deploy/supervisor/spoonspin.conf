[program:spoonspin]
; Prefer the local tsx binary so production does not rely on npx.
command=/var/www/soonspin/spoonspin/node_modules/.bin/tsx server/index.ts
directory=/var/www/soonspin/spoonspin
user=www-data
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/spoonspin.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=NODE_ENV="production",HOME="/var/www/soonspin",PATH="/usr/local/bin:/usr/bin:/bin"
