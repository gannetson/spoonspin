[program:spoonspin]
; Prefer the local tsx binary so production does not rely on npx.
; Must NOT run as root — peer auth uses the OS user as the DB role (www-data).
; Use a modern Node (20+) so Web Crypto / arctic OAuth works. Ubuntu's
; /usr/bin/node is often 18 and breaks Google login with "crypto is not defined".
; Prefer a Node binary that www-data can execute (nvm path or /usr/local/bin/node).
command=/var/www/spoonspin/spoonspin/node_modules/.bin/tsx server/index.ts
directory=/var/www/spoonspin/spoonspin
user=www-data
group=www-data
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/spoonspin.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=NODE_ENV="production",HOME="/var/www/spoonspin",USER="www-data",PATH="/home/gannetson/.nvm/versions/node/v25.9.0/bin:/usr/local/bin:/usr/bin:/bin"
