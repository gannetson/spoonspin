# Target HTTPS site for spoonspin.nl (after Let's Encrypt certs exist).
# Install as /etc/nginx/sites-available/spoonspin.nl (or merge with certbot output).

server {
    listen 80;
    listen [::]:80;
    server_name spoonspin.nl www.spoonspin.nl;
    return 301 https://spoonspin.nl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.spoonspin.nl;

    ssl_certificate     /etc/letsencrypt/live/spoonspin.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoonspin.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://spoonspin.nl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spoonspin.nl;

    ssl_certificate     /etc/letsencrypt/live/spoonspin.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoonspin.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/spoonspin/spoonspin/dist;
    index index.html;

    # Cache hashed Vite assets; keep HTML fresh
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin OpenAI discover/enrich can run several minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
