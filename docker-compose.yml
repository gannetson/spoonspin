services:
  db:
    image: postgres:16-alpine
    container_name: spoonspin-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: spoonspin
      POSTGRES_PASSWORD: spoonspin
      POSTGRES_DB: spoonspin
    volumes:
      - spoonspin_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoonspin -d spoonspin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spoonspin_pgdata:
